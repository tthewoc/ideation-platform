services:
  db:
    image: postgres:17.7-bookworm@sha256:86e0b703649d7a792bd9243ee28afc9d8f7c6b2b5638077c9d6882d4d472bbfd
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run npm run setup}
      POSTGRES_DB: ideator
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ideator']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
